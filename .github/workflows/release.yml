name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Package
        run: |
          mkdir -p out/CS2-IdleStopper
          cp bin/Release/net8.0/CS2-IdleStopper.dll out/CS2-IdleStopper/
          cd out && zip -r ../CS2-IdleStopper.zip CS2-IdleStopper

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2-IdleStopper.zip
          generate_release_notes: true
