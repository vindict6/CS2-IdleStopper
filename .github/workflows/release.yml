name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Package
        run: |
          PLUGIN=out/addons/counterstrikesharp/plugins/CS2-IdleStopper
          CONFIG=out/addons/counterstrikesharp/configs/plugins/CS2-IdleStopper
          mkdir -p "$PLUGIN" "$CONFIG"
          cp bin/Release/net8.0/CS2-IdleStopper.dll "$PLUGIN/"
          cp configs/CS2-IdleStopper.example.json "$CONFIG/"
          cd out && zip -r ../CS2-IdleStopper.zip addons

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2-IdleStopper.zip
          generate_release_notes: true
